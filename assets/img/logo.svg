<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="logoTitle">
  <title id="logoTitle">Pondok Pesantren Ath-Thoifah Al Manshuroh</title>
  <defs>
    <path id="ringTop" d="M 30 108 A 74 74 0 0 1 170 108" />
  </defs>

  <!-- double ring, as on the school's own signboard emblem -->
  <circle cx="100" cy="100" r="94" fill="none" stroke="#d4af5a" stroke-width="2"/>
  <circle cx="100" cy="100" r="85" fill="none" stroke="#d4af5a" stroke-width="1"/>

  <!-- curved ring text: PONDOK PESANTREN -->
  <text font-family="'Rubik', sans-serif" font-size="11" font-weight="600" letter-spacing="2.4" fill="#e9d39a">
    <textPath href="#ringTop" startOffset="50%" text-anchor="middle">PONDOK PESANTREN</textPath>
  </text>

  <!-- four compass stars, as on the original emblem -->
  <g fill="#d4af5a">
    <path d="M100 20 l2.4 5.6 5.6 2.4 -5.6 2.4 -2.4 5.6 -2.4-5.6 -5.6-2.4 5.6-2.4 Z"/>
    <path d="M100 180 l2.4 5.6 5.6 2.4 -5.6 2.4 -2.4 5.6 -2.4-5.6 -5.6-2.4 5.6-2.4 Z" transform="translate(0,-24)"/>
    <path d="M28 100 l2.4 5.6 5.6 2.4 -5.6 2.4 -2.4 5.6 -2.4-5.6 -5.6-2.4 5.6-2.4 Z" transform="translate(0,-100) rotate(90 100 100)"/>
    <path d="M172 100 l2.4 5.6 5.6 2.4 -5.6 2.4 -2.4 5.6 -2.4-5.6 -5.6-2.4 5.6-2.4 Z" transform="rotate(90 100 100) translate(0,-100)"/>
  </g>

  <!-- open book, center emblem -->
  <g fill="none" stroke="#d4af5a" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M100 68 C 78 76, 64 96, 64 122 L100 110 L136 122 C136 96, 122 76, 100 68 Z"/>
    <path d="M100 68 L100 110"/>
    <path d="M78 88 L94 100 M122 88 L106 100" stroke-width="2"/>
  </g>

  <!-- Arabic name, straight (never curve Arabic on a path — it garbles the glyphs) -->
  <text x="100" y="140" font-family="'Amiri', serif" font-size="13" fill="#ece6d6" text-anchor="middle" direction="rtl">الطائفة المنصورة</text>

  <!-- location, straight -->
  <text x="100" y="158" font-family="'Rubik', sans-serif" font-size="7.5" font-weight="500" letter-spacing="1.6" fill="#a4ad9f" text-anchor="middle">LUBUK PAKAM · DELI SERDANG</text>
</svg>
